name: "Lesson 2 - Exercise 1"

on:
  workflow_dispatch: 

jobs:
  test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Experiment
        run: |
          echo $CONTAINS
          echo $EQUAL
          echo $TO_JSON
        env:
          CONTAINS: ${{ contains('Github_action ctions', 'action') }}
          EQUAL: ${{ 1==1 }}
          TO_JSON: ${{ toJson(github.event) }}
